name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              build-essential git zip unzip openjdk-17-jdk \
              autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
              libncursesw5-dev cmake libffi-dev libssl-dev \
              python3-pip libsqlite3-dev libbz2-dev libreadline-dev \
              libgdbm-dev liblzma-dev tk-dev xz-utils

      - name: Install Buildozer & fixed Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37 buildozer==1.5.0

      - name: Build APK
        env:
          CI: "true"
          TERM: "dumb"
        run: |
          rm -rf .buildozer bin 2>/dev/null || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pak-energy-apk
          path: bin/*.apk
          if-no-files-found: error
